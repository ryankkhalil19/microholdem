[build-system]
requires = ["setuptools>=77", "pybind11>=2.12", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "microholdem"
version = "0.1.0"
description = "Sub-millisecond No-Limit Hold'em decision engine: C++ evaluator, Monte Carlo equity, ICM, CFR solvers, tournament simulator, latency harness."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Khalil" }]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "pybind11>=2.12"]

[project.scripts]
microholdem-bench = "microholdem.bench:main"
microholdem-tables = "microholdem.tables:main"
microholdem-sim = "microholdem.simulate:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microholdem = ["data/*.npy", "data/*.npz", "data/*.json", "py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running exhaustive checks"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "src"
files = ["src/microholdem", "tests"]

[[tool.mypy.overrides]]
module = ["microholdem._core"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Solver code uses the mathematical notation from the docstrings (P, S, K, ...).
"src/microholdem/pushfold.py" = ["N803", "N806"]
"src/microholdem/rivercfr.py" = ["N806"]
"src/microholdem/bench.py" = ["N806", "E501"]
"tests/test_solvers.py" = ["N806"]
