name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Benchmark smoke run
        run: python -m microholdem.bench --quick --out /tmp/bench-ci
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}-py${{ matrix.python }}
          path: /tmp/bench-ci
